name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore ProcessosJudiciais.slnx

      - name: Compilar
        run: dotnet build ProcessosJudiciais.slnx --no-restore --configuration Release

      - name: Rodar testes
        run: dotnet test ProcessosJudiciais.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v5

      - name: Construir imagem
        run: docker build -t api-processos-judiciais .
